name: Nabd Quality
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: nabd-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check_security.py
      - run: python3 scripts/verify_bbc_fixture.py
      - run: python3 scripts/fetch_reference_fixtures.py --offline
      - run: node scripts/check_media_embed.js
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebugAndroidTest -PqaBuild=true --stacktrace
      - run: python3 scripts/assess_quality.py --unit-dir app/build/test-results/testDebugUnitTest --output quality-output/unit-assessment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-junit
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports
            quality-output
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest -PqaBuild=true -Pandroid.testInstrumentationRunnerArguments.modelDownloadConsent=true -Pandroid.testInstrumentationRunnerArguments.notClass=com.nabd.news.BbcReferenceDeviceTest,com.nabd.news.SceneTrendsDeviceTest,com.nabd.news.WorldTranslationDeviceTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-junit-${{ matrix.api }}
          path: app/build/outputs/androidTest-results/connected
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          path: app/build/reports/androidTests
  quality-gate:
    name: Required quality gate
    if: always()
    needs: [unit, device]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject failed, cancelled or skipped mandatory jobs
        run: |
          test '${{ needs.unit.result }}' = success
          test '${{ needs.device.result }}' = success
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unit-junit
          path: quality-inputs/unit
      - uses: actions/download-artifact@v4
        with:
          name: device-junit-35
          path: quality-inputs/device-35
      - uses: actions/download-artifact@v4
        with:
          name: device-junit-36
          path: quality-inputs/device-36
      - run: python3 scripts/assess_quality.py --unit-dir quality-inputs/unit --device-dir quality-inputs/device-35 --device-dir quality-inputs/device-36 --require-device --output quality-output/assessment.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug -PqaBuild=true -PgalaxyOnly=true
      - uses: actions/upload-artifact@v4
        with:
          name: Nabd-QA-ONLY-NOT-PERSONAL-UPDATE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            quality-output/assessment.json
          if-no-files-found: error
