name: Build BBC diagnostic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build the isolated diagnostic APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PbbcDiagnostic=true --stacktrace
      - name: Verify package isolation and signatures
        shell: bash
        run: |
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          package_info=$("$sdk_tools/aapt" dump badging "$apk_path")
          package_line=${package_info%%$'\n'*}
          [[ "$package_line" == "package: name='com.nabd.news.bbcdiagnostic' "* ]]
          "$sdk_tools/apksigner" verify --verbose "$apk_path"
          "$sdk_tools/apksigner" verify --verbose app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Prepare downloadable files
        run: |
          mkdir -p diagnostic-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk diagnostic-artifacts/Nabd-BBC-diagnostic.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk diagnostic-artifacts/Nabd-BBC-diagnostic-tests.apk
          cp docs/BBC_GALAXY_INSTALL-ar.md diagnostic-artifacts/INSTALL-ar.md
          cp scripts/diagnose_bbc_phone.py diagnostic-artifacts/diagnose_bbc_phone.py
          cd diagnostic-artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nabd-BBC-diagnostic
          path: diagnostic-artifacts/
          if-no-files-found: error
          retention-days: 30
