name: Build Nabd personal reader and media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/check_security.py
      - run: python3 scripts/verify_bbc_fixture.py
      - run: python3 scripts/fetch_reference_fixtures.py
      - run: chmod +x gradlew
      - name: Reuse existing signing key when configured
        env:
          NABD_DEBUG_KEYSTORE_BASE64: ${{ secrets.NABD_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$NABD_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$NABD_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'This run uses a new debug signing key; check compatibility before updating an existing installation.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Reference, real Room integration, lint and production APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -PbbcDiagnostic=false --stacktrace
      - name: Verify production identity and package APK
        shell: bash
        run: |
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          package_info=$("$sdk_tools/aapt" dump badging "$apk_path")
          package_line=${package_info%%$'\n'*}
          [[ "$package_line" == "package: name='com.nabd.news' "* ]]
          "$sdk_tools/apksigner" verify --verbose "$apk_path"
          mkdir -p production-artifacts
          cp "$apk_path" production-artifacts/Nabd-1.3.0-personal.apk
          cp docs/BBC_PRODUCTION_1_3-ar.md production-artifacts/README-ar.md
          cd production-artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nabd-BBC-production-reader-APK
          path: production-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBC-production-test-reports
          path: |
            app/build/reports
            app/build/test-results
            app/schemas
  reader-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          script: ./gradlew connectedDebugAndroidTest -PbbcDiagnostic=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBC-reader-device-reports
          path: app/build/reports/androidTests
